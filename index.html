<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Mi calendario</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:var(--tg-theme-bg-color,#fff);--tx:var(--tg-theme-text-color,#111);--sub:var(--tg-theme-hint-color,#888);
--btn:var(--tg-theme-button-color,#534AB7);--btx:var(--tg-theme-button-text-color,#fff);--sec:var(--tg-theme-secondary-bg-color,#f1f1f1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,Roboto,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);user-select:none;overflow-x:hidden}
#tit{font-size:15px;color:var(--sub);text-align:center;margin:10px 12px 0}
.tabs{display:flex;gap:6px;margin:10px 12px 0}
.tab{flex:1;padding:9px;border-radius:10px;background:var(--sec);text-align:center;font-size:15px}
.tab.on{background:var(--btn);color:var(--btx);font-weight:600}
.cab{display:flex;align-items:center;justify-content:space-between;padding:10px 8px 2px}
.cab b{font-size:19px}.fl{font-size:26px;padding:4px 14px;color:var(--sub)}
.ayuda{text-align:center;font-size:12px;color:var(--sub);margin-bottom:4px}
#vp{overflow:hidden;touch-action:pan-y}
#tira{display:flex;transition:transform .25s ease}
.mes{flex:0 0 100%;padding:0 8px}
.g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.sem{text-align:center;font-size:12px;color:var(--sub);padding:3px 0}
.d{aspect-ratio:1/1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;
background:var(--sec);position:relative}
.d{flex-direction:column;line-height:1.05}.d.con{font-size:13px;aspect-ratio:auto;min-height:100%;padding:3px 1px}.hr{font-size:8px;font-weight:500;opacity:.9;margin-top:1px;text-align:center;line-height:1.15;white-space:nowrap;overflow:hidden;max-width:100%;letter-spacing:-.2px}.hr b{font-weight:700}.pt{display:block;font-size:7px;color:#A32D2D;font-weight:700;letter-spacing:.2px}
.d.x{opacity:.5}.d.x.con{opacity:.8}.d.l{background:#E24B4A;color:#fff}.d.v{background:#378ADD;color:#fff}.d.o{background:#639922;color:#fff}
.d.w{box-shadow:inset 4px 0 0 #E24B4A}.ti{display:block;font-size:9px;font-weight:700;letter-spacing:.2px}
.d.r::before{content:"⭐";position:absolute;top:0;left:2px;font-size:9px}
.d.e{background:#EF9F27;color:#412402}.d.p{background:#FAC775;color:#412402}.d.f{outline:2px dashed #378ADD;outline-offset:-3px}
.d.sel{box-shadow:inset 0 0 0 3px var(--btn);}
.d.sel::after{content:"✓";position:absolute;top:1px;right:4px;font-size:11px;color:var(--btn)}
.d.l.sel::after,.d.v.sel::after,.d.o.sel::after{color:#fff}
.d.hoy{text-decoration:underline}
.ley{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--sub);margin:12px 12px 150px}
.ley i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
#aviso{position:fixed;left:0;right:0;bottom:70px;text-align:center;font-size:13px;color:var(--sub)}
#otro{position:fixed;left:12px;right:12px;bottom:76px;padding:12px;border:0;border-radius:12px;background:var(--sec);color:var(--tx);font-size:15px;display:none}
.d.busco{outline:3px solid #639922;outline-offset:-3px}
#grp{display:none;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 12px 0;font-size:13px;color:var(--sub);align-items:center}
.chip{padding:6px 11px;border-radius:16px;background:var(--sec);color:var(--tx);font-size:14px}
.chip.on{background:var(--btn);color:var(--btx);font-weight:600}
#tit.paso{font-size:17px;color:var(--tx);font-weight:600}
#nom{padding:4px 10px;border-radius:10px;background:var(--sec)}#nom::after{content:" ▾";font-size:13px;color:var(--sub)}
#sal{display:none;position:fixed;inset:0;background:var(--bg);z-index:9;padding:14px 12px 90px;overflow-y:auto}
#sal h3{margin:14px 4px 8px;font-size:17px}.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mg div{padding:12px 0;border-radius:10px;background:var(--sec);text-align:center;font-size:15px}.mg div.on{background:var(--btn);color:var(--btx);font-weight:600}
#hecho{position:fixed;left:12px;right:12px;bottom:14px;padding:14px;border:0;border-radius:12px;background:var(--btn);color:var(--btx);
font-size:16px;font-weight:600}
</style></head><body>
<div id="tit"></div>
<div class="tabs" id="tabs"></div>
<div id="grp"></div>
<div class="cab"><span class="fl" id="ant">‹</span><b id="nom"></b><span class="fl" id="sig">›</span></div>
<div class="ayuda">Desliza para cambiar de mes · toca el mes para saltar a otro</div>
<div id="sal"></div>
<div id="vp"><div id="tira"></div></div>
<div class="ley" id="ley"></div>
<div id="aviso"></div>
<button id="otro">🔴 Cualquiera de mis libres (lo hablamos)</button>
<button id="hecho">Hecho</button>
<script>
/* Los datos llegan en ?d= de la dirección (solo códigos de días, sin nombres):
   {t: título, i: "aaaa-mm-dd" primer día, c: un carácter por día desde i, m: [{k, n, s:[índices elegidos]}]}
   c: "." trabajas · "l" libras · "v" vacaciones · "o" concedido · "e" en espera · "p" pendiente · "f" festivo · "-" no se puede */
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let D;
// Los datos van en ?d=... (Telegram usa el #... para lo suyo)
const crudo = new URLSearchParams(location.search).get("d") || location.hash.slice(1).split("&")[0];
try { D = JSON.parse(decodeURIComponent(escape(atob(crudo.replace(/-/g,"+").replace(/_/g,"/"))))); }
catch (e) { document.body.innerHTML = "<p style='padding:20px'>No hay datos. Ábrelo desde el bot.</p>"; throw e; }
const ini = new Date(D.i + "T12:00:00");
const N = D.c.length;
const fechaDe = n => { const x = new Date(ini); x.setDate(x.getDate() + n); return x; };
const idx = f => Math.round((f - ini) / 864e5);
const hoyI = D.hoy || 0;
const fmt = n => { const f = fechaDe(n); return String(f.getDate()).padStart(2, "0") + "/" + String(f.getMonth() + 1).padStart(2, "0"); };
const H = D.h || {};
const Y = D.y || {};
const R = D.r || {};  // ⭐ días que te conviene pedir: [índice de inicio del puente, fin, cuántos pides]  // tipo de libre pedido o concedido (L26, L06…)  // horas del turno de cada día (si ya está nombrado)
// Qué se puede tocar en cada modo
const PUEDE = {q: c => ".epf".includes(c), o: c => c === "l", p: c => ".f".includes(c), g: c => c === "l", h: c => ".epf".includes(c), a: c => "oep".includes(c), c: c => c !== "-"};
const modos = D.m.map(m => ({k: m.k, n: m.n, ini: new Set(m.s), sel: new Set(m.s)}));
let modo = modos.find(m => m.k === new URLSearchParams(location.search).get("k")) || modos[0];
document.getElementById("tit").textContent = D.t || "";
const tabs = document.getElementById("tabs");
if (modos.length > 1) modos.forEach(m => {
  const b = document.createElement("div"); b.className = "tab"; b.textContent = m.n;
  b.onclick = () => { modo = m; pinta(); }; m.el = b; tabs.appendChild(b);
}); else tabs.style.display = "none";
// Meses que cubren los datos
const meses = [];
for (let f = new Date(ini.getFullYear(), ini.getMonth(), 1); f <= fechaDe(N - 1); f = new Date(f.getFullYear(), f.getMonth() + 1, 1)) meses.push(f);
let cur = 0;
if (D.a) { const a = new Date(D.a + "T12:00:00"); cur = Math.max(0, meses.findIndex(m => m.getFullYear() === a.getFullYear() && m.getMonth() === a.getMonth())); }
const tira = document.getElementById("tira");
function pinta() {
  modos.forEach(m => m.el && m.el.classList.toggle("on", m === modo));
  tira.innerHTML = "";
  meses.forEach(m => {
    const div = document.createElement("div"); div.className = "mes";
    let h = '<div class="g">' + "LMXJVSD".split("").map(x => `<div class="sem">${x}</div>`).join("");
    const primero = (m.getDay() + 6) % 7;
    for (let i = 0; i < primero; i++) h += "<div></div>";
    const dias = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate();
    for (let d = 1; d <= dias; d++) {
      const n = idx(new Date(m.getFullYear(), m.getMonth(), d, 12));
      const c = n >= 0 && n < N ? D.c[n] : "-";
      let cls = "d";
      if ("lvoepw".includes(c)) cls += " " + c;
      if (c === "f") cls += " f";
      if (c === "-" ) cls += " x";
      else if ((!PUEDE[modo.k](c) || n <= hoyI || (modo.k === "p" && H[n])) && !modo.sel.has(n)
               && !("oe".includes(c) && n > hoyI && "pc".includes(modo.k))) cls += " x";
      if (modo.sel.has(n)) cls += " sel";
      if (n === hoyI) cls += " hoy";
      if (R[n] && (modo.k === "p" || modo.k === "c")) cls += " r";
      if ((modo.k === "g" || modo.k === "h") && n === modo.busco) cls += " busco";
      let hr = "";
      if (H[n]) {
        // Turno (T001) y horario: si es partido, cada parte en su línea para que se vea que es partido
        const [hs0, lt0] = H[n].split("|"), [ln, tn] = (lt0 || "/").split("/");
        const corta = x => x.replace(/^0/, "");
        const partes = hs0 === "?" ? [] : hs0.split("+").map(x => x.split("-").map(corta).join("–"));
        hr = `<div class="hr">${tn ? "<b>" + (ln ? "L" + ln.replace(/^0+/, "") + " " : "") + "T" + tn + "</b>" : ""}${partes.map(x => (tn || partes.length > 1 ? "<br>" : "") + x).join("")}`
          + `${partes.length > 1 ? '<span class="pt">partido</span>' : ""}</div>`;
        cls += " con";
      }
      const ti = Y[n] ? `<span class="ti">${Y[n]}</span>` : (c === "w" && !hr ? '<span class="ti">trabajas</span>' : "");
      h += `<div class="${cls}" data-n="${n}">${d}${ti}${hr}</div>`;
    }
    div.innerHTML = h + "</div>"; tira.appendChild(div);
  });
  mueve(false); cuenta();
}
function mueve(anima = true) {
  tira.style.transition = anima ? "transform .25s ease" : "none";
  tira.style.transform = `translateX(${-cur * 100}%)`;
  const m = meses[cur]; document.getElementById("nom").textContent = MESES[m.getMonth()] + " " + m.getFullYear();
}
function cuenta() {
  if (modo.k === "h") { document.getElementById("hecho").textContent = modo.sel.size ? `Quiero ${modo.sel.size} día${modo.sel.size > 1 ? "s" : ""} a cambio · Seguir` : "Cualquier día (lo habláis) · Seguir"; return; }
  if (modo.k === "c") { const k = modo.sel.size; document.getElementById("hecho").textContent = k ? `Ver quién libra · ${k} día${k > 1 ? "s" : ""}` : "Toca los días que quieres cambiar"; return; }
  if (modo.k === "g") { document.getElementById("hecho").textContent = modo.sel.size ? `Doy ${modo.sel.size} día${modo.sel.size > 1 ? "s" : ""} · Seguir` : "Elige tus libres o toca el botón de arriba"; return; }
  let mas = 0, menos = 0;
  modos.forEach(m => { m.sel.forEach(n => { if (!m.ini.has(n)) mas++; }); m.ini.forEach(n => { if (!m.sel.has(n)) menos++; }); });
  document.getElementById("hecho").textContent = mas + menos ? `Hecho · ${mas ? mas + " nuevo" + (mas > 1 ? "s" : "") : ""}${mas && menos ? ", " : ""}${menos ? menos + " quitado" + (menos > 1 ? "s" : "") : ""}` : "Cerrar";
}
tira.addEventListener("click", ev => {
  const el = ev.target.closest(".d"); if (!el) return;
  const n = +el.dataset.n;
  const cd = D.c[n];
  // ✅ Concedido o ⏳ en espera: qué hacer con él (cambiarlo con un compañero o anularlo)
  if ("oe".includes(cd) && n > hoyI && !modo.sel.has(n) && "pc".includes(modo.k) && tg && tg.showPopup) {
    const ti = Y[n] ? ` (${Y[n]})` : "";
    const bts = [{id: "c", type: "default", text: "🤝 Cambiar con compañero"}];
    if (cd === "o") bts.push({id: "a", type: "destructive", text: "🗑 Anularlo"});
    bts.push({type: "cancel"});
    tg.showPopup({title: cd === "o" ? `✅ Concedido el ${fmt(n)}${ti}` : `⏳ En espera el ${fmt(n)}${ti}`,
      message: cd === "o" ? "Lo puedes cambiar con un compañero o anularlo (el libre vuelve a quedar disponible)."
                          : "Mientras esperas, puedes buscar a un compañero que te lo cambie.", buttons: bts},
      id => {
        if (id !== "c" && id !== "a") return;
        const m = modos.find(x => x.k === id); if (!m) return;
        m.sel.add(n); modo = m; pinta();
        if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    return;
  }
  if (el.classList.contains("x") && !el.classList.contains("sel")) {
    if (H[n]) {  // día con turno: se enseña qué hiciste (o harás)
      const [hs, lt, co, bu] = H[n].split("|"), [ln, tn] = (lt || "/").split("/");
      const txt = `${fmt(n)}${ln ? " · Línea " + ln.replace(/^0+/, "") : ""}${tn ? " · Turno " + tn : ""}\n`
        + (hs === "?" ? "" : hs.split("+").map((x, i) => (hs.includes("+") ? (i ? "2ª parte: " : "1ª parte: ") : "") + x.replace("-", " a ")).join("\n"))
        + (bu ? "\n🚌 Autobús: " + bu.split(",").join(" y ") : "")
        + (co ? "\nCoche del cuadro: " + co.split(",").join(" y ") : "");
      if (tg && tg.showAlert) tg.showAlert(txt); else document.getElementById("aviso").textContent = txt;
    }
    return;
  }
  if (R[n] && !modo.sel.has(n) && (modo.k === "p" || modo.k === "c") && tg && tg.showPopup) {
    const [a, b, k] = R[n], largo = b - a + 1;
    tg.showPopup({title: "⭐ Te conviene pedirlo",
      message: `Pidiendo ${k > 1 ? k + " días (este y los siguientes)" : "solo este"} libras del ${fmt(a)} al ${fmt(b)}: ${largo} días seguidos.`,
      buttons: [{id: "p", type: "default", text: "📌 Pedir por generado"}, {id: "c", type: "default", text: "🤝 Cambiar con compañero"}, {type: "cancel"}]},
      id => {
        if (id !== "p" && id !== "c") return;
        const m = modos.find(x => x.k === id); if (!m) return;
        m.sel.add(n); modo = m; pinta();
        if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      });
    return;
  }
  if (modo.sel.has(n)) modo.sel.delete(n); else modo.sel.add(n);
  if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
  el.classList.toggle("sel"); cuenta();
});
// Saltar directamente a un mes/año (tocando el nombre del mes)
const sal = document.getElementById("sal");
document.getElementById("nom").onclick = () => {
  let h = "", anio = null;
  meses.forEach((m, i) => {
    if (m.getFullYear() !== anio) { if (anio !== null) h += "</div>"; anio = m.getFullYear(); h += `<h3>${anio}</h3><div class="mg">`; }
    h += `<div data-i="${i}"${i === cur ? ' class="on"' : ""}>${MESES[m.getMonth()].slice(0, 3)}</div>`;
  });
  sal.innerHTML = h + "</div>"; sal.style.display = "block";
  const on = sal.querySelector(".on"); if (on) on.scrollIntoView({block: "center"});
};
sal.onclick = ev => { const el = ev.target.closest("[data-i]"); sal.style.display = "none"; if (el) { cur = +el.dataset.i; mueve(false); } };
document.getElementById("ant").onclick = () => { if (cur > 0) { cur--; mueve(); } };
document.getElementById("sig").onclick = () => { if (cur < meses.length - 1) { cur++; mueve(); } };
// Deslizar con el dedo
let x0 = null, y0 = 0, dx = 0;
const vp = document.getElementById("vp");
vp.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; tira.style.transition = "none"; }, {passive: true});
vp.addEventListener("touchmove", e => {
  if (x0 === null) return;
  dx = e.touches[0].clientX - x0;
  if (Math.abs(dx) > Math.abs(e.touches[0].clientY - y0)) tira.style.transform = `translateX(calc(${-cur * 100}% + ${dx}px))`;
}, {passive: true});
vp.addEventListener("touchend", () => {
  if (x0 === null) return;
  if (dx < -50 && cur < meses.length - 1) cur++; else if (dx > 50 && cur > 0) cur--;
  x0 = null; mueve();
});
// Leyenda
const LEY = [["#E24B4A","libras"],["#378ADD","vacaciones"],["#639922","concedido"],["#EF9F27","en espera"],["#FAC775","pendiente"]];
document.getElementById("ley").innerHTML = LEY.filter(([, n], i) => D.c.includes("lvoep"[i])).map(([c, n]) => `<span><i style="background:${c}"></i>${n}</span>`).join("")
  + (Object.keys(R).length ? '<span>⭐ te conviene pedir</span>' : "")
  + (D.c.includes("w") ? '<span><i style="box-shadow:inset 4px 0 0 #E24B4A;background:var(--sec)"></i>trabajas en tu libre</span>' : "")
  + (D.c.includes("f") ? '<span><i style="outline:2px dashed #378ADD;outline-offset:-2px"></i>festivo</span>' : "")
  + '<span><i style="box-shadow:inset 0 0 0 2px var(--btn)"></i>elegido</span>';
// Paso 2: por cada día nuevo que buscas, qué libres das a cambio (se elige aquí mismo)
let pendientes = null, resultado = null; const dar = {}, doy = {};
function envia() {
  if (tg && tg.sendData) tg.sendData(JSON.stringify({i: D.i, r: resultado, g: dar, h: doy}));
  else document.getElementById("aviso").textContent = JSON.stringify({r: resultado, g: dar, h: doy});
}
const grp = document.getElementById("grp");
function chips(n) {  // para quién es el libre que das: todos o un grupo
  grp.innerHTML = "Para:" + ["", ...(D.gr || [])].map(g => `<span class="chip${modo.gr === g ? " on" : ""}" data-g="${g}">${g ? "Grupo " + g : "Todos"}</span>`).join("");
}
grp.onclick = ev => { const c = ev.target.closest(".chip"); if (!c) return; modo.gr = c.dataset.g; chips(); };
function siguiente() {
  if (!pendientes.length) return envia();
  const {k, n} = pendientes.shift();
  const t = document.getElementById("tit"); t.className = "paso";
  tabs.style.display = "none";
  if (k === "q") {
    modo = {k: "g", busco: n, ini: new Set(), sel: new Set((D.p || {})[n] || [])};
    t.textContent = `¿Qué das por el ${fmt(n)}? Toca tus libres 🔴`;
    document.getElementById("otro").style.display = "block"; grp.style.display = "none";
  } else {
    modo = {k: "h", busco: n, ini: new Set(), sel: new Set(), gr: ""};
    t.textContent = `Das el ${fmt(n)}. ¿Qué día quieres a cambio? Toca días que trabajas`;
    document.getElementById("otro").style.display = "none"; grp.style.display = "flex"; chips();
  }
  const f = fechaDe(n); cur = Math.max(0, meses.findIndex(m => m.getFullYear() === f.getFullYear() && m.getMonth() === f.getMonth()));
  pinta(); window.scrollTo(0, 0);
}
document.getElementById("otro").onclick = () => { dar[modo.busco] = []; siguiente(); };
document.getElementById("hecho").onclick = () => {
  if (modo.k === "g") { if (!modo.sel.size) return; dar[modo.busco] = [...modo.sel]; return siguiente(); }
  if (modo.k === "h") { doy[modo.busco] = {q: [...modo.sel], gr: modo.gr}; return siguiente(); }
  const r = {};
  modos.forEach(m => r[m.k] = {a: [...m.sel].filter(n => !m.ini.has(n)), q: [...m.ini].filter(n => !m.sel.has(n))});
  const hay = Object.values(r).some(x => x.a.length || x.q.length);
  if (!hay) { if (tg) tg.close(); return; }
  resultado = r;
  pendientes = [...(r.q ? r.q.a : []).map(n => ({k: "q", n})), ...(r.o ? r.o.a : []).map(n => ({k: "o", n}))].sort((a, b) => a.n - b.n);
  siguiente();
};
pinta();
</script></body></html>
